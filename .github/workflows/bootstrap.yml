name: Bootstrap source
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack site source
        run: |
          unzip -q tj15-source-1794144550.zip -d _bootstrap
          cp -R _bootstrap/tianjin-vehicle-depot-15th/. .
          rm -rf _bootstrap tj15-source-1794144550.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: unpack site source"
          git push
